name: Panlith release arm64

on:
  push:
    branches: [panlith]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: panlith release apk (arm64)
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload R8 mapping
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (arm64)
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt
